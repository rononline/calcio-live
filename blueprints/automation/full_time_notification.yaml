blueprint:
  name: Soccer Live - Full time notification
  description: Send a notification with the final score when a Soccer Live sensor reports full time.
  domain: automation
  input:
    soccer_sensor:
      name: Soccer Live sensor
      selector:
        entity:
          domain: sensor
    notify_service:
      name: Notify service
      description: "Example: notify.mobile_app_iphone"
      selector:
        text:

trigger:
  - platform: state
    entity_id: !input soccer_sensor
    attribute: last_match_finished_event

condition:
  - condition: template
    value_template: "{{ trigger.to_state.attributes.last_match_finished_event is defined }}"
  - condition: template
    value_template: "{{ trigger.from_state is none or trigger.from_state.attributes.last_match_finished_event != trigger.to_state.attributes.last_match_finished_event }}"

action:
  - service: !input notify_service
    data:
      title: "Full time"
      message: >-
        {% set event = trigger.to_state.attributes.last_match_finished_event %}
        {{ event.home_team }} {{ event.home_score }} - {{ event.away_score }} {{ event.away_team }}
        {% if event.goal_scorers_str is defined and event.goal_scorers_str not in ['N/A', ''] %}· {{ event.goal_scorers_str }}{% endif %}

mode: queued
