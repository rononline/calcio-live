name: Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Check for undefined names and syntax errors
        run: >-
          ruff check custom_components/soccer_live tests scripts
          --select E9,F63,F7,F82,I,RUF100,RUF012,RUF013
      - name: Run tests
        # The real-HA test (tests/test_ha_config_flow.py) is skipped here
        # (its plugin isn't installed) and runs in the ha-tests job instead.
        run: python -m pytest tests/ -q

  ha-tests:
    name: Real Home Assistant test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install Home Assistant test dependencies
        run: pip install -r requirements-test.txt -r requirements-ha-test.txt
      - name: Run the real Home Assistant test
        # Run on its own: the other test files install lightweight `homeassistant`
        # stubs into sys.modules, which would shadow the real HA in one process.
        run: python -m pytest tests/test_ha_config_flow.py -q

  blueprints:
    name: Validate blueprints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Validate blueprints
        run: python scripts/validate_blueprints.py
