name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  pytest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest python-dateutil
      - name: Run tests
        run: python -m pytest tests/ -q

  blueprints:
    name: Validate blueprints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate blueprints
        run: python scripts/validate_blueprints.py
