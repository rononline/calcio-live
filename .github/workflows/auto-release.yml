name: Auto Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'custom_components/soccer_live/manifest.json'

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml

  hassfest:
    uses: ./.github/workflows/hassfest.yaml

  hacs:
    uses: ./.github/workflows/hacs_action.yaml

  release:
    needs: [tests, hassfest, hacs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/soccer_live/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes from changelog
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTE=$(awk -v version="$VERSION" '
            index($0, "## v" version " ") == 1 || $0 == "## v" version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          [ -z "$NOTE" ] && NOTE=$(git log -1 --pretty=%B)
          {
            echo 'notes<<EOF_NOTES'
            echo "$NOTE"
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build zip asset
        if: steps.check.outputs.exists == 'false'
        working-directory: custom_components
        run: |
          zip -r "$GITHUB_WORKSPACE/soccer_live.zip" soccer_live/ \
            --exclude "soccer_live/__pycache__/*" \
            --exclude "soccer_live/*.pyc"
          test -s "$GITHUB_WORKSPACE/soccer_live.zip"

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: soccer_live.zip
          draft: false
          prerelease: false

      - name: Verify release asset
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=""
          for attempt in 1 2 3 4 5; do
            SIZE=$(gh release view "${{ steps.version.outputs.tag }}" \
              --json assets \
              --jq '.assets[] | select(.name == "soccer_live.zip") | .size' \
              2>/dev/null || true)
            [ -n "$SIZE" ] && [ "$SIZE" -gt 0 ] && break
            sleep $((attempt * 2))
          done
          test -n "$SIZE"
          test "$SIZE" -gt 0
