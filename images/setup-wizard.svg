<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Soccer Live setup walkthrough</title>
  <desc id="desc">Four Home Assistant setup panels: choose a provider, choose Team, find a club and add a card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#17122b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#25b8e6"/>
      <stop offset="1" stop-color="#7167ff"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".35"/></filter>
    <style>
      .panel{fill:#171a25;stroke:#34394f;stroke-width:2;filter:url(#shadow)}
      .top{fill:#202431}.title{font:700 22px system-ui,sans-serif;fill:#f5f7ff}
      .step{font:800 14px system-ui,sans-serif;fill:#7dd9f7;letter-spacing:1px}
      .label{font:600 15px system-ui,sans-serif;fill:#b9c0d3}
      .choice{fill:#242938;stroke:#3c435b;stroke-width:1.5}.selected{fill:#192f3d;stroke:#25b8e6;stroke-width:2}
      .text{font:600 16px system-ui,sans-serif;fill:#f5f7ff}.sub{font:400 13px system-ui,sans-serif;fill:#939bb0}
      .button{fill:url(#accent)}.buttonText{font:800 15px system-ui,sans-serif;fill:#fff}
      .number{fill:#25b8e6}.numberText{font:900 16px system-ui,sans-serif;fill:#081018}
    </style>
  </defs>
  <rect width="1500" height="720" rx="34" fill="url(#bg)"/>
  <text x="55" y="65" class="title" font-size="30">Soccer Live · eerste installatie</text>
  <text x="55" y="92" class="sub">De actuele driestappenwizard en de kaartkeuze</text>

  <g transform="translate(45 125)">
    <rect class="panel" width="330" height="535" rx="22"/>
    <path class="top" d="M22 0h286a22 22 0 0 1 22 22v65H0V22A22 22 0 0 1 22 0z"/>
    <circle class="number" cx="35" cy="43" r="18"/><text class="numberText" x="30" y="49">1</text>
    <text class="title" x="66" y="50">Databron</text>
    <text class="step" x="24" y="122">KIES EEN PROVIDER</text>
    <rect class="selected" x="24" y="145" width="282" height="92" rx="14"/>
    <text class="text" x="45" y="181">ESPN</text>
    <text class="sub" x="45" y="207">Gratis · geen API-sleutel</text>
    <circle cx="280" cy="191" r="10" fill="#25b8e6"/>
    <rect class="choice" x="24" y="250" width="282" height="92" rx="14"/>
    <text class="text" x="45" y="286">API-Football</text>
    <text class="sub" x="45" y="312">Eigen sleutel · extra data</text>
    <circle cx="280" cy="296" r="10" fill="none" stroke="#7d859b" stroke-width="2"/>
    <rect class="button" x="166" y="467" width="140" height="44" rx="12"/>
    <text class="buttonText" x="204" y="495">Volgende</text>
  </g>

  <g transform="translate(405 125)">
    <rect class="panel" width="330" height="535" rx="22"/>
    <path class="top" d="M22 0h286a22 22 0 0 1 22 22v65H0V22A22 22 0 0 1 22 0z"/>
    <circle class="number" cx="35" cy="43" r="18"/><text class="numberText" x="30" y="49">2</text>
    <text class="title" x="66" y="50">Volgen</text>
    <text class="step" x="24" y="122">WAT WIL JE VOLGEN?</text>
    <rect class="selected" x="24" y="145" width="282" height="72" rx="14"/>
    <text class="text" x="45" y="188">⚽  Team</text>
    <rect class="choice" x="24" y="230" width="282" height="72" rx="14"/>
    <text class="text" x="45" y="273">🏆  Competitie</text>
    <rect class="choice" x="24" y="315" width="282" height="72" rx="14"/>
    <text class="text" x="45" y="358">📰  Nieuws</text>
    <text class="sub" x="24" y="423">De beschikbare keuzes volgen de provider.</text>
    <rect class="button" x="166" y="467" width="140" height="44" rx="12"/>
    <text class="buttonText" x="204" y="495">Volgende</text>
  </g>

  <g transform="translate(765 125)">
    <rect class="panel" width="330" height="535" rx="22"/>
    <path class="top" d="M22 0h286a22 22 0 0 1 22 22v65H0V22A22 22 0 0 1 22 0z"/>
    <circle class="number" cx="35" cy="43" r="18"/><text class="numberText" x="30" y="49">3</text>
    <text class="title" x="66" y="50">Team zoeken</text>
    <text class="label" x="24" y="127">Competitie</text>
    <rect class="choice" x="24" y="142" width="282" height="54" rx="12"/>
    <text class="text" x="43" y="176">Eredivisie</text><text class="sub" x="278" y="176">⌄</text>
    <text class="label" x="24" y="232">Team</text>
    <rect class="selected" x="24" y="247" width="282" height="72" rx="12"/>
    <circle cx="54" cy="283" r="17" fill="#e30613"/><text class="buttonText" x="48" y="289">F</text>
    <text class="text" x="82" y="279">Feyenoord</text><text class="sub" x="82" y="299">Rotterdam</text>
    <rect class="button" x="166" y="467" width="140" height="44" rx="12"/>
    <text class="buttonText" x="207" y="495">Voltooien</text>
  </g>

  <g transform="translate(1125 125)">
    <rect class="panel" width="330" height="535" rx="22"/>
    <path class="top" d="M22 0h286a22 22 0 0 1 22 22v65H0V22A22 22 0 0 1 22 0z"/>
    <circle class="number" cx="35" cy="43" r="18"/><text class="numberText" x="30" y="49">4</text>
    <text class="title" x="66" y="50">Kaart toevoegen</text>
    <text class="label" x="24" y="127">Kaarttype</text>
    <rect class="selected" x="24" y="142" width="282" height="58" rx="12"/>
    <text class="text" x="43" y="178">Match Center</text><text class="sub" x="278" y="178">⌄</text>
    <text class="label" x="24" y="237">Entiteit</text>
    <rect class="choice" x="24" y="252" width="282" height="76" rx="12"/>
    <text class="sub" x="43" y="278">Soccer Live · Feyenoord</text>
    <text class="text" x="43" y="305">Volgende wedstrijd</text>
    <text class="label" x="24" y="365">Aanvullende sensor (optioneel)</text>
    <rect class="choice" x="24" y="380" width="282" height="54" rx="12"/>
    <text class="sub" x="43" y="413">Geen</text>
    <rect class="button" x="166" y="467" width="140" height="44" rx="12"/>
    <text class="buttonText" x="211" y="495">Opslaan</text>
  </g>
</svg>
