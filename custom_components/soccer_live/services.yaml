simulate_match_event:
  name: Simulate match event
  description: Fires a safe provider-neutral test event without changing sensor data, caches or deduplication storage.
  fields:
    event_type:
      name: Event type
      required: true
      selector:
        select:
          options:
            - match_started
            - goal
            - yellow_card
            - red_card
            - substitution
            - halftime
            - second_half
            - match_finished
            - lineup_available
            - postponed
            - cancelled
    event_id:
      name: Match ID
      default: simulated-match
      selector:
        text:
    team_id:
      name: Tracked team ID
      selector:
        text:
    home_team:
      name: Home team
      default: Feyenoord
      selector:
        text:
    away_team:
      name: Away team
      default: Tegenstander
      selector:
        text:
    home_score:
      name: Home score
      default: 0
      selector:
        number:
          min: 0
          max: 20
          mode: box
    away_score:
      name: Away score
      default: 0
      selector:
        number:
          min: 0
          max: 20
          mode: box
    player:
      name: Player
      selector:
        text:
    minute:
      name: Minute
      selector:
        text:

refresh:
  name: Refresh Soccer Live
  description: Requests an immediate refresh from all sensors, or one selected config entry.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional Soccer Live config entry ID. Leave empty to refresh all entries.
      selector:
        config_entry:
          integration: soccer_live

clear_match_archive:
  name: Clear match archive
  description: Permanently clears the locally stored match archive for one or all Soccer Live entries.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional Soccer Live config entry ID. Leave empty to clear all entries.
      selector:
        config_entry:
          integration: soccer_live

rebuild_match_archive:
  name: Rebuild match archive
  description: Adds currently available finished matches to the local archive.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional Soccer Live config entry ID. Leave empty to rebuild all entries.
      selector:
        config_entry:
          integration: soccer_live

import_match_archive:
  name: Import match archive
  description: Replaces the local archive with a Soccer Live JSON export.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional Soccer Live config entry ID. Leave empty to import into all entries.
      selector:
        config_entry:
          integration: soccer_live
    archive:
      name: Archive JSON
      required: true
      selector:
        text:
          multiline: true

export_match_archive:
  name: Export match archive
  description: Returns the locally stored archives as JSON-compatible service response data.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional Soccer Live config entry ID. Leave empty to export all entries.
      selector:
        config_entry:
          integration: soccer_live

sync_match_archive:
  name: Sync match archive
  description: Merges a remote soccer_live.archive.v1 or supported legacy JSON archive into the selected local archive.
  fields:
    config_entry_id:
      name: Config entry ID
      selector:
        config_entry:
          integration: soccer_live
    url:
      name: Archive URL
      description: Optional HTTP(S) URL. Leave empty to use the URL configured in the integration options.
      selector:
        text:

play_match_replay:
  name: Play match replay
  description: Replays the recorded match snapshots as safe simulated Home Assistant events. Uses a built-in full-match demo when no recording is available.
  fields:
    config_entry_id:
      name: Config entry ID
      selector:
        config_entry:
          integration: soccer_live
    speed:
      name: Speed
      default: 20
      selector:
        number:
          min: 0.2
          max: 20
          step: 0.2
          mode: slider
    demo:
      name: Use demo match
      default: false
      selector:
        boolean:

clear_match_replay:
  name: Clear match replay
  description: Clears the locally recorded match snapshots for one or all Soccer Live entries.
  fields:
    config_entry_id:
      name: Config entry ID
      selector:
        config_entry:
          integration: soccer_live

export_match_replay:
  name: Export match replay
  description: Returns recorded provider-neutral match snapshots for diagnostics and regression fixtures.
  fields:
    config_entry_id:
      name: Config entry ID
      selector:
        config_entry:
          integration: soccer_live
